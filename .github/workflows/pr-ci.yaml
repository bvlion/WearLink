name: Pull Request CI

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'wear/**'
      - 'shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/pr-ci.yaml'

permissions:
  id-token: write
  contents: read
  checks: write

jobs:
  pr-ci:
    runs-on: ubuntu-latest

    env:
      HOST: http://localhost
    
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'

      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Start Http Docker
        run: docker run -p 80:80 -d --name httpbin kennethreitz/httpbin

      - name: Build mobile and wear debug APKs
        run: ./gradlew :mobile:assembleDebug :wear:assembleDebug
  
      - name: Wait for the service to start
        run: |
          while ! curl --output /dev/null --silent --head --fail http://localhost; do
            sleep 1
          done

      - name: Run test
        run: ./gradlew testDebugUnitTest
  
      - name: Stop Docker container
        run: docker stop httpbin

      - name: shared test report
        uses: dorny/test-reporter@v3
        if: github.actor != 'dependabot[bot]'
        with:
          name: shared test
          path: shared/build/test-results/testDebugUnitTest/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: mobile test report
        uses: dorny/test-reporter@v3
        if: github.actor != 'dependabot[bot]'
        with:
          name: mobile test
          path: mobile/build/test-results/testDebugUnitTest/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: wear test report
        uses: dorny/test-reporter@v3
        if: github.actor != 'dependabot[bot]'
        with:
          name: wear test
          path: wear/build/test-results/testDebugUnitTest/TEST-*.xml
          reporter: java-junit
          fail-on-error: false
